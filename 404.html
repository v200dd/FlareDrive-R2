<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f7" />
    <title>页面不存在 · FlareDrive</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #2f353b; background: #f5f6f7; font: 16px/1.5 system-ui, sans-serif; }
      main { min-height: 100vh; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      h1, p { margin: 0; }
      h1 { font-size: 24px; }
      p { color: #616b74; }
      a { display: inline-block; padding: 10px 16px; border-radius: 6px; color: white; background: #2677b8; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>这个页面不存在</h1>
      <p>地址可能已更改，或文件已被移除。</p>
      <a href="/">返回文件库</a>
    </main>
  </body>
</html>
