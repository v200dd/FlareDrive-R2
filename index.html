<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f7" />
    <meta name="description" content="FlareDrive 文件管理" />
    <title>FlareDrive 文件库</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/assets/manifest.json" />
    <style>
      html, body, #app { min-height: 100%; margin: 0; }
      .boot-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; box-sizing: border-box; color: #2f353b; background: #f5f6f7; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
      .boot-mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 14px; color: white; background: #f38020; font-size: 24px; font-weight: 700; }
      .boot-error h1, .boot-error p { margin: 0; }
      .boot-error details { max-width: min(640px, 90vw); text-align: left; }
      .boot-error pre { white-space: pre-wrap; overflow-wrap: anywhere; }
      .boot-error button { padding: 10px 16px; border: 0; border-radius: 6px; color: white; background: #2677b8; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="app" aria-live="polite">
      <main class="boot-screen">
        <div class="boot-mark" aria-hidden="true">F</div>
        <p>正在启动 FlareDrive…</p>
        <noscript>请启用浏览器 JavaScript 后访问 FlareDrive。</noscript>
      </main>
    </div>
    <script type="module" src="/assets/bootstrap.mjs"></script>
  </body>
</html>
